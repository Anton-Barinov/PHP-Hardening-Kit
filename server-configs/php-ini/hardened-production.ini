; ==============================================================================
; PHP-Hardening-Kit: Production PHP Hardening Baseline
; Part of PHP-Hardening-Kit by Anton Barinov
; https://github.com/Anton-Barinov/PHP-Hardening-Kit
; ==============================================================================

[PHP]
; 1. Information Disclosure
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
ignore_repeated_errors = On
ignore_repeated_source = On

; 2. Remote Resource Inclusion & Wrappers
allow_url_fopen = Off
allow_url_include = Off

; 3. Vector 1 Hardening: Multipart & Upload Progress
session.upload_progress.enabled = Off
max_file_uploads = 20
max_input_vars = 5000

; 4. Vector 4 Hardening: Phar Deserialization
phar.readonly = On
phar.require_hash = On

; 5. Vector 5 Hardening: Dangerous Functions
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_multi_exec,parse_ini_file,show_source,dl,symlink,link,highlight_file

; 6. Session Security
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.use_only_cookies = 1
session.cache_limiter = nocache

; 7. Limits & Execution Timeout
max_execution_time = 30
max_input_time = 60
memory_limit = 256M
post_max_size = 32M
upload_max_filesize = 20M
