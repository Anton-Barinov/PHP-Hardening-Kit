; ==============================================================================
; PHP-Hardening-Kit: E-Commerce & CMS Profile (OpenCart, WordPress, Bitrix)
; Part of PHP-Hardening-Kit by Anton Barinov
; https://github.com/Anton-Barinov/PHP-Hardening-Kit
; ==============================================================================

[PHP]
; 1. Information Disclosure
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On

; 2. E-Commerce API Requirements
; allow_url_fopen is kept ON for payment gateway APIs and webhook delivery
allow_url_fopen = On
allow_url_include = Off

; 3. Form & Attribute Limits (Essential for OpenCart / Bitrix product grids)
max_input_vars = 10000
max_execution_time = 90
memory_limit = 512M
post_max_size = 64M
upload_max_filesize = 50M

; 4. Vector 1 Hardening: Multipart & Upload Progress
; If C-patches are applied, upload_progress can stay on; otherwise turn off:
session.upload_progress.enabled = Off

; 5. Vector 4 Hardening: Phar Protection
phar.readonly = On
phar.require_hash = On

; 6. Vector 5 Hardening: Selective Function Disabling
; Disables system execution while preserving cURL & image processing for CMS modules
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,parse_ini_file,show_source,dl,symlink,link,highlight_file

; 7. Hardened Session Cookies
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_only_cookies = 1
