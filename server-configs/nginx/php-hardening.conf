# ==============================================================================
# PHP-Hardening-Kit: Nginx Security Hardening Rules
# Part of PHP-Hardening-Kit by Anton Barinov
# https://github.com/Anton-Barinov/PHP-Hardening-Kit
# ==============================================================================
#
# Drop-in protection snippet for Nginx server blocks.
# Include inside your server { ... } block:
#     include /etc/nginx/snippets/php-hardening.conf;
#

# 1. Block CVE-2024-4577 (Windows Best-Fit CGI Argument Injection) & CVE-2012-1823
# Drops queries attempting to pass command-line arguments to PHP-CGI
if ($query_string ~* "(\-d|\-s|\-w|\-f|\-n|\-c|%ad|%2d|\%u00ad)") {
    return 403;
}
if ($query_string ~* "(allow_url_include|auto_prepend_file|auto_append_file|disable_functions)") {
    return 403;
}

# 2. Block PHP Filter Chain Exploitation (CVE-2024-2961) & Stream Wrapper Injections
if ($query_string ~* "(php://filter|expect://|data://|phar://)") {
    return 403;
}

# 3. Block Hidden / Sensitive Files (.env, .git, .svn, .bak, .sql, .yml, .tar.gz)
location ~* /\.(git|svn|hg|bzr|env|yml|yaml|sql|bak|backup|config|inc|ini)$ {
    deny all;
    return 404;
}

# 4. Deny direct web execution of PHP files in upload/cache directories
# (Critical for OpenCart, WordPress, Bitrix, Drupal, Joomla)
location ~* /(upload|uploads|images|media|files|attachments|cache|tmp)/.*\.php$ {
    deny all;
    return 403;
}

# 5. Block Null-Byte (%00) and suspicious path traversals in URI
if ($request_uri ~* "(\x00|%00|\.\./)") {
    return 403;
}

# 6. Security Headers (Modern HTTP Baseline)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
