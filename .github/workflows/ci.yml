name: CI Test Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['5.6', '7.0', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, session, mbstring

      - name: Run PHP Syntax Check
        run: |
          find guard/ -name "*.php" -exec php -l {} \;
          php -l bin/php-hardening-check

      - name: Run Exploit Vector & False Positive Tests
        run: |
          php tests/run_tests.php

      - name: Test CLI Auditor Script
        run: |
          chmod +x bin/php-hardening-check
          ./bin/php-hardening-check --json
